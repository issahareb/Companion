name: GuardianGrid verification
on:
  push:
    branches:
      - feat/guardiangrid-2-audit-redesign-20261018
    paths-ignore:
      - client/public/guardian-ghost-animated.webp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run check
      - name: Production bundling
        run: npm run build
